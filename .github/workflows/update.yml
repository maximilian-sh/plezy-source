name: Update source

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-source
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build source.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/source.json
        run: python3 build_source.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- source.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "Update source.json"
          git push
